<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭内居酒屋「大将、あれ頼む！」</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&family=Yuji+Boku&display=swap" rel="stylesheet">
  <style>
    body { background-color:#2b1810; color:#f3e9dc; font-family:'Zen Maru Gothic',sans-serif; }
    .store-title { font-family:'Yuji Boku',serif; }
    button:disabled { opacity:.55; cursor:not-allowed; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-3 sm:p-6">
  <header class="w-full max-w-md bg-[#1a0f0a] border-4 border-[#d4af37] rounded-2xl p-4 text-center shadow-2xl mb-4 relative">
    <div class="absolute -top-2.5 -left-2 bg-red-800 text-yellow-300 text-[10px] px-2.5 py-1 rounded-br font-bold shadow">本日も営業中</div>
    <h1 class="text-2xl font-bold text-[#f59e0b] tracking-widest mt-1 store-title">居酒屋『我が家』</h1>
    <p class="text-xs text-stone-400 mt-0.5">〜 自由な注文、大歓迎！ 〜</p>
    <div class="mt-3 bg-black/60 rounded-xl p-2.5 text-xs flex justify-around border border-stone-700">
      <span>担当大将：<strong class="text-amber-400" id="daisho-display">パパ</strong></span>
      <span>本日のお仕事完了：<strong class="text-green-400" id="order-count">0</strong> 品</span>
    </div>
    <div class="mt-3 text-left">
      <div id="connection-status" class="text-xs text-stone-300 mb-2" role="status" aria-live="polite">Firebaseに接続する準備中…</div>
      <div class="flex gap-2">
        <button id="login-button" type="button" class="flex-1 bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold py-2 rounded-lg text-xs">Googleでログイン</button>
        <button id="logout-button" type="button" class="hidden bg-stone-700 hover:bg-stone-600 text-white font-bold px-3 py-2 rounded-lg text-xs">ログアウト</button>
      </div>
      <div id="account-display" class="text-[10px] text-stone-400 mt-1 break-all"></div>
    </div>
  </header>

  <main class="w-full max-w-md space-y-4">
    <section class="bg-[#3e2723] border-2 border-[#8d6e63] rounded-2xl p-4 shadow-lg">
      <h2 class="text-sm font-bold text-amber-200 border-b border-[#5d4037] pb-2 mb-3 flex items-center justify-between">
        <span>📝 自由にお品書きを書く（注文票）</span><span class="text-[10px] bg-amber-900 text-amber-200 px-2 py-0.5 rounded">客席端末</span>
      </h2>
      <div class="space-y-3">
        <div>
          <label for="custom-menu-input" class="block text-xs text-stone-300 mb-1">頼みたい用事（自由に入力）</label>
          <input type="text" id="custom-menu-input" placeholder="例：お風呂の栓をして！、醤油買ってきて" class="w-full px-3 py-3 rounded-xl bg-[#2b1810] border border-[#6d4c41] text-white focus:outline-none focus:border-amber-500 text-base">
        </div>
        <div>
          <span class="block text-[10px] text-stone-400 mb-1">⚡ ワンタッチクイック注文：</span>
          <div class="flex flex-wrap gap-1.5">
            <button type="button" onclick="quickOrder('お風呂掃除お願いします！')" class="bg-[#2b1810] hover:bg-[#4e342e] border border-[#6d4c41] text-amber-300 text-xs px-3 py-2 rounded-lg">風呂掃除</button>
            <button type="button" onclick="quickOrder('ゴミ出しよろしく！')" class="bg-[#2b1810] hover:bg-[#4e342e] border border-[#6d4c41] text-amber-300 text-xs px-3 py-2 rounded-lg">ゴミ出し</button>
            <button type="button" onclick="quickOrder('寝かしつけバトンタッチ！')" class="bg-[#2b1810] hover:bg-[#4e342e] border border-[#6d4c41] text-amber-300 text-xs px-3 py-2 rounded-lg">寝かしつけ</button>
            <button type="button" onclick="quickOrder('お茶（水分）持ってきて')" class="bg-[#2b1810] hover:bg-[#4e342e] border border-[#6d4c41] text-amber-300 text-xs px-3 py-2 rounded-lg">お茶・水分</button>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <div>
            <label for="menu-reward" class="block text-xs text-stone-300 mb-1">手間（重さ）</label>
            <select id="menu-reward" class="w-full px-2.5 py-3 rounded-xl bg-[#2b1810] border border-[#6d4c41] text-white text-xs">
              <option value="小鉢 (5分)">小鉢 (5分・軽微)</option><option value="定番 (15分)">定番 (15分・普通)</option><option value="特選メイン (30分+)">特選！(30分・大仕事)</option>
            </select>
          </div>
          <div>
            <label for="menu-target" class="block text-xs text-stone-300 mb-1">指名先</label>
            <select id="menu-target" class="w-full px-2.5 py-3 rounded-xl bg-[#2b1810] border border-[#6d4c41] text-white text-xs">
              <option value="大将">大将へ</option><option value="女将/相方">女将へ</option><option value="どなたでも！">どなたでも！</option>
            </select>
          </div>
        </div>
        <button id="add-button" type="button" onclick="addOrder()" disabled class="w-full bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 text-stone-950 font-bold py-3 rounded-xl shadow-md transition transform active:scale-95 text-xs tracking-wider">🏮 威勢よく注文を通す！</button>
        <p class="text-[10px] text-stone-400">※ ログイン後に注文できます。</p>
      </div>
    </section>

    <section class="bg-[#1e1e1e] border-2 border-stone-700 rounded-2xl p-4 shadow-lg">
      <h2 class="text-sm font-bold text-yellow-400 border-b border-stone-800 pb-2 mb-3 flex items-center justify-between">
        <span>🔥 厨房カウンター（未対応）</span><span id="badge-count" class="bg-red-600 text-white text-xs px-2 py-0.5 rounded-full font-bold">0件</span>
      </h2>
      <div id="order-list" class="space-y-2.5 max-h-72 overflow-y-auto pr-1"><div class="text-center text-stone-500 text-xs py-8">Googleログインすると注文を読み込みます。</div></div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';
    import { getFirestore, doc, onSnapshot, runTransaction, serverTimestamp } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyD1Hu2PC_A0hExbyemVnp3iiKvf1bLtuCo',
      authDomain: 'izakayaapp.firebaseapp.com',
      projectId: 'izakayaapp',
      storageBucket: 'izakayaapp.firebasestorage.app',
      messagingSenderId: '594968829381',
      appId: '1:594968829381:web:7bf3e3161e67ca790f3fac',
      measurementId: 'G-TTPNL393CQ'
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const stateRef = doc(db, 'household', 'state');
    let currentUser = null;
    let orders = [];
    let completedCount = 0;
    let unsubscribeState = null;
    let busy = false;

    const statusEl = document.getElementById('connection-status');
    const loginButton = document.getElementById('login-button');
    const logoutButton = document.getElementById('logout-button');
    const addButton = document.getElementById('add-button');
    const listEl = document.getElementById('order-list');
    const badgeEl = document.getElementById('badge-count');
    const countEl = document.getElementById('order-count');
    const accountEl = document.getElementById('account-display');

    function setStatus(message) { statusEl.textContent = message; }
    function setBusy(value) {
      busy = value;
      addButton.disabled = !currentUser || busy;
      document.querySelectorAll('.complete-order-button').forEach(button => button.disabled = busy);
    }
    function showError(error, context) {
      console.error(context, error);
      if (error?.code === 'permission-denied' || error?.code === 'firestore/permission-denied') {
        setStatus('データベースのアクセス設定を確認してください（Firestoreのルールが未設定の可能性があります）。');
      } else if (error?.code === 'auth/unauthorized-domain') {
        setStatus('このサイトのドメインがFirebaseの承認済みドメインに登録されていません。');
      } else {
        setStatus(`${context}：${error?.message || 'エラーが発生しました。'}`);
      }
    }

    window.quickOrder = function(text) { document.getElementById('custom-menu-input').value = text; };

    function render() {
      badgeEl.textContent = `${orders.length}件`;
      countEl.textContent = String(completedCount);
      if (!orders.length) {
        listEl.innerHTML = '<div class="text-center text-stone-500 text-xs py-8">現在、注文はありません。平和な店内です。</div>';
        return;
      }
      listEl.innerHTML = '';
      orders.forEach(order => {
        const item = document.createElement('div');
        item.className = 'bg-[#2a2a2a] border-l-4 border-amber-500 p-3 rounded-xl flex items-center justify-between gap-3 shadow';
        const details = document.createElement('div');
        details.className = 'space-y-0.5 min-w-0';
        const meta = document.createElement('div');
        meta.className = 'text-[10px] text-amber-400 font-bold';
        meta.textContent = `【宛先: ${order.target || 'どなたでも！'}】 ${order.reward || ''}`;
        const text = document.createElement('div');
        text.className = 'text-sm font-bold text-white break-words';
        text.textContent = order.text || '';
        const time = document.createElement('div');
        time.className = 'text-[10px] text-stone-400';
        time.textContent = `注文時刻: ${order.time || '--:--'}`;
        details.append(meta, text, time);
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'complete-order-button bg-green-700 hover:bg-green-600 text-white text-xs px-3 py-3 rounded-xl font-bold transition shadow shrink-0 active:scale-95';
        button.textContent = '調理完了 🍺';
        button.disabled = busy;
        button.addEventListener('click', () => completeOrder(order.id));
        item.append(details, button);
        listEl.appendChild(item);
      });
    }

    function listenToSharedState() {
      if (unsubscribeState) unsubscribeState();
      setStatus('共有データを読み込んでいます…');
      unsubscribeState = onSnapshot(stateRef, async snapshot => {
        if (!snapshot.exists()) {
          // Create an empty shared state once. Do not seed the original sample orders.
          try {
            await runTransaction(db, async transaction => {
              const latest = await transaction.get(stateRef);
              if (!latest.exists()) transaction.set(stateRef, { orders: [], completedCount: 0, updatedAt: serverTimestamp() });
            });
          } catch (error) { showError(error, '初期データの作成に失敗しました'); }
          return;
        }
        const data = snapshot.data();
        orders = Array.isArray(data.orders) ? data.orders : [];
        completedCount = Number.isFinite(data.completedCount) ? data.completedCount : 0;
        render();
        setStatus('🟢 夫婦で同期中');
        setBusy(false);
      }, error => showError(error, '注文データの読み込みに失敗しました'));
    }

    async function updateSharedState(mutator) {
      if (!currentUser || busy) return;
      setBusy(true);
      try {
        await runTransaction(db, async transaction => {
          const snapshot = await transaction.get(stateRef);
          const data = snapshot.exists() ? snapshot.data() : { orders: [], completedCount: 0 };
          const next = mutator({
            orders: Array.isArray(data.orders) ? data.orders.map(order => ({...order})) : [],
            completedCount: Number.isFinite(data.completedCount) ? data.completedCount : 0
          });
          transaction.set(stateRef, { orders: next.orders, completedCount: next.completedCount, updatedAt: serverTimestamp() });
        });
      } catch (error) {
        showError(error, '保存できませんでした');
        alert('保存できませんでした。Firebaseの設定や通信状況を確認してください。');
      } finally {
        setBusy(false);
      }
    }

    window.addOrder = async function() {
      const input = document.getElementById('custom-menu-input');
      const text = input.value.trim();
      if (!text) { alert('頼みたい用事を自由に入力してください！'); return; }
      if (!currentUser) { alert('先にGoogleログインしてください。'); return; }
      const reward = document.getElementById('menu-reward').value;
      const target = document.getElementById('menu-target').value;
      const now = new Date();
      const time = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      const newOrder = { id: `${Date.now()}-${Math.random().toString(36).slice(2,8)}`, text, reward, target, time, createdBy: currentUser.email || '' };
      await updateSharedState(state => { state.orders.push(newOrder); return state; });
      input.value = '';
      if (navigator.vibrate) navigator.vibrate(40);
    };

    async function completeOrder(id) {
      if (!currentUser) return;
      await updateSharedState(state => {
        const index = state.orders.findIndex(order => order.id === id);
        if (index !== -1) { state.orders.splice(index, 1); state.completedCount += 1; }
        return state;
      });
      if (navigator.vibrate) navigator.vibrate(70);
    }

    loginButton.addEventListener('click', async () => {
      try {
        setStatus('Googleログイン画面へ移動します…');
        await signInWithRedirect(auth, new GoogleAuthProvider());
      } catch (error) { showError(error, 'ログインに失敗しました'); }
    });
    logoutButton.addEventListener('click', async () => {
      try { await signOut(auth); } catch (error) { showError(error, 'ログアウトに失敗しました'); }
    });

    getRedirectResult(auth).catch(error => showError(error, 'Googleログインに失敗しました'));
    onAuthStateChanged(auth, user => {
      currentUser = user;
      if (user) {
        loginButton.classList.add('hidden');
        logoutButton.classList.remove('hidden');
        accountEl.textContent = `ログイン中：${user.email || 'Googleアカウント'}`;
        setStatus('ログインしました。共有データに接続しています…');
        addButton.disabled = false;
        listenToSharedState();
      } else {
        if (unsubscribeState) { unsubscribeState(); unsubscribeState = null; }
        orders = [];
        completedCount = 0;
        render();
        loginButton.classList.remove('hidden');
        logoutButton.classList.add('hidden');
        accountEl.textContent = '';
        addButton.disabled = true;
        setStatus('ログインすると、夫婦で注文を共有できます。');
        listEl.innerHTML = '<div class="text-center text-stone-500 text-xs py-8">Googleログインすると注文を読み込みます。</div>';
      }
    });
  </script>
</body>
</html>

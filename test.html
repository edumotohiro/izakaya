<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭内居酒屋「大将、あれ頼む！」</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&family=Yuji+Boku&display=swap" rel="stylesheet">
  <style>
    body { background-color:#2b1810; color:#f3e9dc; font-family:'Zen Maru Gothic',sans-serif; }
    .store-title { font-family:'Yuji Boku',serif; }
    button:disabled { opacity:.55; cursor:not-allowed; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-3 sm:p-6">
  <header class="w-full max-w-md bg-[#1a0f0a] border-4 border-[#d4af37] rounded-2xl p-4 text-center shadow-2xl mb-4 relative">
    <div class="absolute -top-2.5 -left-2 bg-red-800 text-yellow-300 text-[10px] px-2.5 py-1 rounded-br font-bold shadow">本日も営業中</div>
    <h1 class="text-2xl font-bold text-[#f59e0b] tracking-widest mt-1 store-title">居酒屋『我が家』</h1>
    <p class="text-xs text-stone-400 mt-0.5">〜 自由な注文、大歓迎！ 〜</p>
    <div class="mt-3 bg-black/60 rounded-xl p-2.5 text-xs flex justify-around border border-stone-700">
      <span>担当大将：<strong class="text-amber-400" id="daisho-display">パパ</strong></span>
      <span>本日のお仕事完了：<strong class="text-green-400" id="order-count">0</strong> 品</span>
      <span>貯まったポイント：<strong class="text-amber-300" id="points-total">0</strong> pt</span>
    </div>
    <div class="mt-3 text-left">
      <div id="connection-status" class="text-xs text-stone-300 mb-2" role="status" aria-live="polite">Firebaseに接続する準備中…</div>
      <div class="flex gap-2">
        <button id="login-button" type="button" class="flex-1 bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold py-2 rounded-lg text-xs">Googleでログイン</button>
        <button id="logout-button" type="button" class="hidden bg-stone-700 hover:bg-stone-600 text-white font-bold px-3 py-2 rounded-lg text-xs">ログアウト</button>
      </div>
      <div id="account-display" class="text-[10px] text-stone-400 mt-1 break-all"></div>
    </div>
  </header>

  <main class="w-full max-w-md space-y-4">
    <section class="bg-[#3e2723] border-2 border-[#8d6e63] rounded-2xl p-4 shadow-lg">
      <h2 class="text-sm font-bold text-amber-200 border-b border-[#5d4037] pb-2 mb-3">📝 自由にお品書きを書く（注文票）</h2>
      <div class="space-y-3">
        <div>
          <label for="custom-menu-input" class="block text-xs text-stone-300 mb-1">頼みたい用事（自由に入力）</label>
          <input type="text" id="custom-menu-input" placeholder="例：お風呂の栓をして！、醤油買ってきて" class="w-full px-3 py-3 rounded-xl bg-[#2b1810] border border-[#6d4c41] text-white focus:outline-none focus:border-amber-500 text-base">
        </div>
        <div>
          <span class="block text-[10px] text-stone-400 mb-1">⚡ ワンタッチクイック注文：</span>
          <div id="quick-buttons" class="flex flex-wrap gap-1.5"></div>
        </div>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <div>
            <label for="menu-points" class="block text-xs text-stone-300 mb-1">獲得ポイント</label>
            <input id="menu-points" type="number" min="0" max="1000" step="1" value="1" class="w-full px-2.5 py-3 rounded-xl bg-[#2b1810] border border-[#6d4c41] text-white text-sm">
          </div>
          <div>
            <label for="menu-target" class="block text-xs text-stone-300 mb-1">指名先</label>
            <select id="menu-target" class="w-full px-2.5 py-3 rounded-xl bg-[#2b1810] border border-[#6d4c41] text-white text-xs">
              <option value="大将">大将へ</option><option value="女将/相方">女将へ</option><option value="どなたでも！">どなたでも！</option>
            </select>
          </div>
        </div>
        <div>
          <label for="menu-reward" class="block text-xs text-stone-300 mb-1">手間（重さ）</label>
          <select id="menu-reward" class="w-full px-2.5 py-3 rounded-xl bg-[#2b1810] border border-[#6d4c41] text-white text-xs">
            <option value="小鉢 (5分)">小鉢 (5分・軽微)</option><option value="定番 (15分)">定番 (15分・普通)</option><option value="特選メイン (30分+)">特選！(30分・大仕事)</option>
          </select>
        </div>
        <button id="add-button" type="button" onclick="addOrder()" disabled class="w-full bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 text-stone-950 font-bold py-3 rounded-xl shadow-md transition transform active:scale-95 text-xs tracking-wider">🏮 威勢よく注文を通す！</button>
        <p class="text-[10px] text-stone-400">※ ログイン後に注文できます。完了するとポイントが貯まります。</p>
      </div>
    </section>

    <section class="bg-[#1e1e1e] border-2 border-stone-700 rounded-2xl p-4 shadow-lg">
      <h2 class="text-sm font-bold text-yellow-400 border-b border-stone-800 pb-2 mb-3 flex items-center justify-between">
        <span>🔥 厨房カウンター（未対応）</span><span id="badge-count" class="bg-red-600 text-white text-xs px-2 py-0.5 rounded-full font-bold">0件</span>
      </h2>
      <div id="order-list" class="space-y-2.5 max-h-96 overflow-y-auto pr-1"><div class="text-center text-stone-500 text-xs py-8">Googleログインすると注文を読み込みます。</div></div>
    </section>

    <section class="bg-[#302019] border border-[#8d6e63] rounded-2xl p-4 shadow-lg">
      <div class="flex items-center justify-between gap-2">
        <div>
          <h2 class="text-sm font-bold text-amber-200">⚙️ いつもの仕事を設定</h2>
          <p class="text-[10px] text-stone-400 mt-1">クイック注文の名前・依頼文・ポイントを編集できます。</p>
        </div>
        <button id="toggle-task-settings" type="button" class="bg-stone-700 text-white text-xs px-3 py-2 rounded-lg">設定を開く</button>
      </div>
      <div id="task-settings" class="hidden mt-3 space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <div><label for="task-label" class="block text-xs text-stone-300 mb-1">ボタン名</label><input id="task-label" maxlength="24" placeholder="例：お米を炊く" class="w-full px-2 py-2 rounded-lg bg-[#2b1810] border border-[#6d4c41] text-white text-sm"></div>
          <div><label for="task-points" class="block text-xs text-stone-300 mb-1">ポイント</label><input id="task-points" type="number" min="0" max="1000" step="1" value="1" class="w-full px-2 py-2 rounded-lg bg-[#2b1810] border border-[#6d4c41] text-white text-sm"></div>
        </div>
        <div><label for="task-text" class="block text-xs text-stone-300 mb-1">依頼文</label><input id="task-text" maxlength="120" placeholder="例：お米を炊いてください！" class="w-full px-2 py-2 rounded-lg bg-[#2b1810] border border-[#6d4c41] text-white text-sm"></div>
        <div class="flex gap-2">
          <button id="save-task-button" type="button" class="flex-1 bg-amber-600 text-stone-950 font-bold text-xs py-2 rounded-lg">新しい仕事を追加</button>
          <button id="cancel-task-edit" type="button" class="hidden bg-stone-700 text-white text-xs px-3 py-2 rounded-lg">編集をやめる</button>
        </div>
        <div id="task-list" class="space-y-2"></div>
      </div>
    </section>

    <section class="bg-[#302019] border border-[#8d6e63] rounded-2xl p-4 shadow-lg">
      <div class="flex items-center justify-between gap-2">
        <div>
          <h2 class="text-sm font-bold text-amber-200">📜 お仕事の履歴</h2>
          <p class="text-[10px] text-stone-400 mt-1">完了・キャンセルした仕事を確認できます。</p>
        </div>
        <button id="toggle-history" type="button" class="bg-stone-700 text-white text-xs px-3 py-2 rounded-lg">履歴を見る</button>
      </div>
      <div id="history-panel" class="hidden mt-3">
        <div class="text-xs text-amber-200 mb-2">過去の記録（新しい順）</div>
        <div id="history-list" class="space-y-2 max-h-96 overflow-y-auto"></div>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';
    import { getFirestore, doc, onSnapshot, runTransaction, serverTimestamp } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyD1Hu2PC_A0hExbyemvNP3iiKvf1bLtuCo',
      authDomain: 'izakayaapp.firebaseapp.com',
      projectId: 'izakayaapp',
      storageBucket: 'izakayaapp.firebasestorage.app',
      messagingSenderId: '594968829381',
      appId: '1:594968829381:web:7bf3e3161e67ca790f3fac',
      measurementId: 'G-TTPNL393CQ'
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const stateRef = doc(db, 'household', 'state');
    let currentUser = null;
    let orders = [];
    let history = [];
    let completedCount = 0;
    let completedDate = '';
    let pointsTotal = 0;
    let quickTasks = [];
    let unsubscribeState = null;
    let busy = false;
    let editingTaskId = null;

    const defaultTasks = [
      { id: 'rice', label: 'お米を炊く', text: 'お米を炊いてください！', points: 1 },
      { id: 'teeth', label: '子どもたちの歯磨き', text: '子どもたちの歯磨きをお願いします！', points: 2 },
      { id: 'laundry', label: '洗濯物を干す', text: '洗濯物を干してください！', points: 3 },
      { id: 'tea', label: 'お茶をわかす', text: 'お茶をわかしてください！', points: 1 },
      { id: 'bath', label: '風呂掃除', text: 'お風呂掃除お願いします！', points: 2 },
      { id: 'trash', label: 'ゴミ出し', text: 'ゴミ出しよろしく！', points: 1 },
      { id: 'bedtime', label: '寝かしつけ', text: '寝かしつけバトンタッチ！', points: 3 }
    ];

    const statusEl = document.getElementById('connection-status');
    const loginButton = document.getElementById('login-button');
    const logoutButton = document.getElementById('logout-button');
    const addButton = document.getElementById('add-button');
    const listEl = document.getElementById('order-list');
    const badgeEl = document.getElementById('badge-count');
    const countEl = document.getElementById('order-count');
    const accountEl = document.getElementById('account-display');
    const quickButtonsEl = document.getElementById('quick-buttons');
    const historyListEl = document.getElementById('history-list');
    const taskListEl = document.getElementById('task-list');

    function setStatus(message) { statusEl.textContent = message; }
    function todayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function clockText(date = new Date()) {
      return `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
    }
    function dateTimeText(value) {
      if (!value) return '時刻不明';
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return String(value);
      return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${clockText(d)}`;
    }
    function safePoints(value) {
      const n = Number(value);
      return Number.isFinite(n) ? Math.max(0, Math.min(1000, Math.floor(n))) : 0;
    }
    function setBusy(value) {
      busy = value;
      addButton.disabled = !currentUser || busy;
      document.querySelectorAll('.order-action-button, #save-task-button').forEach(button => button.disabled = busy || !currentUser);
    }
    function showError(error, context) {
      console.error(context, error);
      if (error?.code === 'permission-denied' || error?.code === 'firestore/permission-denied') {
        setStatus('データベースのアクセス設定を確認してください（Firestoreのルールが未設定の可能性があります）。');
      } else if (error?.code === 'auth/unauthorized-domain') {
        setStatus('このサイトのドメインがFirebaseの承認済みドメインに登録されていません。');
      } else {
        const code = error?.code ? `（${error.code}）` : '';
        setStatus(`${context}${code}：${error?.message || 'エラーが発生しました。'}`);
      }
    }
    function normalizeState(data = {}) {
      return {
        orders: Array.isArray(data.orders) ? data.orders : [],
        history: Array.isArray(data.history) ? data.history : [],
        completedCount: Number.isFinite(data.completedCount) ? data.completedCount : 0,
        completedDate: typeof data.completedDate === 'string' ? data.completedDate : todayKey(),
        pointsTotal: Number.isFinite(data.pointsTotal) ? Math.max(0, data.pointsTotal) : 0,
        quickTasks: Array.isArray(data.quickTasks)
          ? data.quickTasks
          : defaultTasks.map(task => ({...task}))
      };
    }
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function renderQuickTasks() {
      quickButtonsEl.innerHTML = '';
      quickTasks.forEach(task => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'bg-[#2b1810] hover:bg-[#4e342e] border border-[#6d4c41] text-amber-300 text-xs px-3 py-2 rounded-lg';
        button.textContent = `${task.label}（${safePoints(task.points)}pt）`;
        button.addEventListener('click', () => {
          document.getElementById('custom-menu-input').value = task.text;
          document.getElementById('menu-points').value = safePoints(task.points);
          document.getElementById('custom-menu-input').focus();
        });
        quickButtonsEl.appendChild(button);
      });
    }
    function renderTaskSettings() {
      taskListEl.innerHTML = '';
      if (!quickTasks.length) {
        taskListEl.innerHTML = '<p class="text-xs text-stone-400">仕事がまだありません。</p>';
        return;
      }
      quickTasks.forEach(task => {
        const row = document.createElement('div');
        row.className = 'flex items-center gap-2 bg-black/20 p-2 rounded-lg';
        const info = document.createElement('div');
        info.className = 'min-w-0 flex-1';
        const name = document.createElement('div');
        name.className = 'text-xs font-bold text-white break-words';
        name.textContent = `${task.label}（${safePoints(task.points)}pt）`;
        const desc = document.createElement('div');
        desc.className = 'text-[10px] text-stone-400 break-words';
        desc.textContent = task.text;
        info.append(name, desc);
        const edit = document.createElement('button');
        edit.type = 'button'; edit.className = 'order-action-button bg-stone-700 text-white text-xs px-2 py-2 rounded';
        edit.textContent = '編集';
        edit.addEventListener('click', () => {
          editingTaskId = task.id;
          document.getElementById('task-label').value = task.label;
          document.getElementById('task-text').value = task.text;
          document.getElementById('task-points').value = safePoints(task.points);
          document.getElementById('save-task-button').textContent = '変更を保存';
          document.getElementById('cancel-task-edit').classList.remove('hidden');
          document.getElementById('task-label').focus();
        });
        const del = document.createElement('button');
        del.type = 'button'; del.className = 'order-action-button bg-red-900 text-white text-xs px-2 py-2 rounded';
        del.textContent = '削除';
        del.addEventListener('click', async () => {
          if (!confirm(`「${task.label}」をクイック注文から削除しますか？過去の履歴は消えません。`)) return;
          await updateSharedState(state => {
            state.quickTasks = state.quickTasks.filter(item => item.id !== task.id);
            return state;
          });
          if (editingTaskId === task.id) resetTaskForm();
        });
        row.append(info, edit, del);
        taskListEl.appendChild(row);
      });
    }
    function resetTaskForm() {
      editingTaskId = null;
      document.getElementById('task-label').value = '';
      document.getElementById('task-text').value = '';
      document.getElementById('task-points').value = '1';
      document.getElementById('save-task-button').textContent = '新しい仕事を追加';
      document.getElementById('cancel-task-edit').classList.add('hidden');
    }
    function render() {
      badgeEl.textContent = `${orders.length}件`;
      countEl.textContent = String(completedDate === todayKey() ? completedCount : 0);
      document.getElementById('daisho-display').textContent = 'パパ';
      const pointsDisplay = document.getElementById('points-total');
      if (pointsDisplay) pointsDisplay.textContent = String(pointsTotal);
      renderQuickTasks();
      renderTaskSettings();

      listEl.innerHTML = '';
      if (!orders.length) {
        listEl.innerHTML = '<div class="text-center text-stone-500 text-xs py-8">現在、注文はありません。平和な店内です。</div>';
      } else {
        orders.forEach(order => {
          const item = document.createElement('div');
          item.className = 'bg-[#2a2a2a] border-l-4 border-amber-500 p-3 rounded-xl gap-3 shadow';
          const meta = document.createElement('div');
          meta.className = 'text-[10px] text-amber-400 font-bold';
          meta.textContent = `【宛先: ${order.target || 'どなたでも！'}】 ${order.reward || ''}`;
          const text = document.createElement('div');
          text.className = 'text-sm font-bold text-white break-words mt-1';
          text.textContent = order.text || '';
          const details = document.createElement('div');
          details.className = 'text-[10px] text-stone-400 mt-1';
          details.textContent = `注文時刻: ${order.createdAt ? dateTimeText(order.createdAt) : (order.time || '--:--')} ／ 完了時 ${safePoints(order.points)}ポイント`;
          const actions = document.createElement('div');
          actions.className = 'flex flex-wrap gap-2 mt-3';
          const complete = document.createElement('button');
          complete.type = 'button'; complete.className = 'order-action-button bg-green-700 hover:bg-green-600 text-white text-xs px-3 py-2 rounded-lg font-bold';
          complete.textContent = '完了してポイント獲得';
          complete.disabled = busy || !currentUser;
          complete.addEventListener('click', () => completeOrder(order.id));
          const cancel = document.createElement('button');
          cancel.type = 'button'; cancel.className = 'order-action-button bg-red-900 hover:bg-red-800 text-white text-xs px-3 py-2 rounded-lg';
          cancel.textContent = 'キャンセル';
          cancel.disabled = busy || !currentUser;
          cancel.addEventListener('click', () => cancelOrder(order.id));
          const line = document.createElement('button');
          line.type = 'button'; line.className = 'bg-[#06C755] hover:opacity-90 text-white text-xs px-3 py-2 rounded-lg font-bold';
          line.textContent = 'LINEで伝える';
          line.addEventListener('click', () => shareToLine(order));
          actions.append(complete, cancel, line);
          item.append(meta, text, details, actions);
          listEl.appendChild(item);
        });
      }

      historyListEl.innerHTML = '';
      if (!history.length) {
        historyListEl.innerHTML = '<div class="text-center text-stone-500 text-xs py-5">まだ履歴はありません。</div>';
      } else {
        [...history].sort((a,b) => (b.finishedAt || b.createdAt || 0) - (a.finishedAt || a.createdAt || 0)).slice(0,200).forEach(entry => {
          const row = document.createElement('div');
          row.className = 'bg-black/20 border border-stone-700 rounded-lg p-3';
          const title = document.createElement('div');
          title.className = 'text-xs font-bold text-white break-words';
          title.textContent = entry.text || '名前のない仕事';
          const status = document.createElement('div');
          status.className = `text-[10px] mt-1 ${entry.status === 'completed' ? 'text-green-400' : 'text-red-300'}`;
          status.textContent = entry.status === 'completed'
            ? `完了・${safePoints(entry.points)}ポイント獲得`
            : 'キャンセル（ポイント加算なし）';
          const when = document.createElement('div');
          when.className = 'text-[10px] text-stone-400 mt-1';
          when.textContent = dateTimeText(entry.finishedAt || entry.createdAt);
          row.append(title, status, when);
          historyListEl.appendChild(row);
        });
      }
    }
    async function ensureTodayCount() {
      try {
        await runTransaction(db, async transaction => {
          const snapshot = await transaction.get(stateRef);
          if (!snapshot.exists()) return;
          const data = snapshot.data();
          if (!data.completedDate) {
            transaction.set(stateRef, { ...data, completedDate: todayKey(), updatedAt: serverTimestamp() });
          } else if (data.completedDate !== todayKey()) {
            transaction.set(stateRef, { ...data, completedCount: 0, completedDate: todayKey(), updatedAt: serverTimestamp() });
          }
        });
      } catch (error) { showError(error, '本日の完了数リセットに失敗しました'); }
    }
    function listenToSharedState() {
      if (unsubscribeState) unsubscribeState();
      setStatus('共有データを読み込んでいます…');
      unsubscribeState = onSnapshot(stateRef, async snapshot => {
        if (!snapshot.exists()) {
          try {
            await runTransaction(db, async transaction => {
              const latest = await transaction.get(stateRef);
              if (!latest.exists()) transaction.set(stateRef, {
                orders: [], history: [], completedCount: 0, completedDate: todayKey(),
                pointsTotal: 0, quickTasks: defaultTasks.map(task => ({...task})), updatedAt: serverTimestamp()
              });
            });
          } catch (error) { showError(error, '初期データの作成に失敗しました'); }
          return;
        }
        const data = normalizeState(snapshot.data());
        orders = data.orders;
        history = data.history;
        completedCount = data.completedCount;
        completedDate = data.completedDate;
        pointsTotal = data.pointsTotal;
        quickTasks = data.quickTasks;
        render();
        setStatus('🟢 夫婦で同期中');
        setBusy(false);
        if (snapshot.data().completedDate && snapshot.data().completedDate !== todayKey()) ensureTodayCount();
        else if (!snapshot.data().completedDate) ensureTodayCount();
      }, error => showError(error, '注文データの読み込みに失敗しました'));
    }
    async function updateSharedState(mutator) {
      if (!currentUser || busy) return;
      setBusy(true);
      try {
        await runTransaction(db, async transaction => {
          const snapshot = await transaction.get(stateRef);
          const raw = snapshot.exists() ? snapshot.data() : {};
          const state = normalizeState(raw);
          if (state.completedDate !== todayKey()) {
            state.completedCount = 0;
            state.completedDate = todayKey();
          }
          const next = mutator(state) || state;
          transaction.set(stateRef, {
            orders: next.orders,
            history: next.history,
            completedCount: next.completedCount,
            completedDate: next.completedDate,
            pointsTotal: next.pointsTotal,
            quickTasks: next.quickTasks,
            updatedAt: serverTimestamp()
          });
        });
      } catch (error) {
        showError(error, '保存できませんでした');
        alert('保存できませんでした。Firebaseの設定や通信状況を確認してください。');
      } finally {
        setBusy(false);
      }
    }
    window.quickOrder = function(text) { document.getElementById('custom-menu-input').value = text; };
    window.addOrder = async function() {
      const input = document.getElementById('custom-menu-input');
      const text = input.value.trim();
      if (!text) { alert('頼みたい用事を自由に入力してください！'); return; }
      if (!currentUser) { alert('先にGoogleログインしてください。'); return; }
      const points = safePoints(document.getElementById('menu-points').value);
      const reward = document.getElementById('menu-reward').value;
      const target = document.getElementById('menu-target').value;
      const now = new Date();
      const newOrder = {
        id: `${Date.now()}-${Math.random().toString(36).slice(2,8)}`,
        text, reward, target, points, time: clockText(now), createdAt: now.getTime(),
        createdBy: currentUser.email || ''
      };
      await updateSharedState(state => { state.orders.push(newOrder); return state; });
      input.value = '';
      if (navigator.vibrate) navigator.vibrate(40);
    };
    async function completeOrder(id) {
      if (!currentUser) return;
      await updateSharedState(state => {
        const index = state.orders.findIndex(order => order.id === id);
        if (index === -1) return state; // Prevent double-awarding the same order.
        const [order] = state.orders.splice(index, 1);
        const now = Date.now();
        const awarded = safePoints(order.points);
        state.completedCount = state.completedDate === todayKey() ? state.completedCount + 1 : 1;
        state.completedDate = todayKey();
        state.pointsTotal += awarded;
        state.history.push({ ...order, status: 'completed', finishedAt: now, pointsAwarded: awarded });
        return state;
      });
      if (navigator.vibrate) navigator.vibrate(70);
    }
    async function cancelOrder(id) {
      if (!currentUser) return;
      if (!confirm('この注文をキャンセルしますか？履歴には残りますが、ポイントは加算されません。')) return;
      await updateSharedState(state => {
        const index = state.orders.findIndex(order => order.id === id);
        if (index === -1) return state;
        const [order] = state.orders.splice(index, 1);
        state.history.push({ ...order, status: 'cancelled', finishedAt: Date.now(), pointsAwarded: 0 });
        return state;
      });
    }
    function shareToLine(order) {
      const message = `🍶 大将、注文が入りました！\n📝 ${order.text}\n⭐ 完了すると ${safePoints(order.points)} ポイント！\nアプリを確認してね。`;
      const url = `https://line.me/R/msg/text/?${encodeURIComponent(message)}`;
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    document.getElementById('toggle-history').addEventListener('click', () => {
      const panel = document.getElementById('history-panel');
      const opening = panel.classList.contains('hidden');
      panel.classList.toggle('hidden', !opening);
      document.getElementById('toggle-history').textContent = opening ? '履歴を閉じる' : '履歴を見る';
    });
    document.getElementById('toggle-task-settings').addEventListener('click', () => {
      const panel = document.getElementById('task-settings');
      const opening = panel.classList.contains('hidden');
      panel.classList.toggle('hidden', !opening);
      document.getElementById('toggle-task-settings').textContent = opening ? '設定を閉じる' : '設定を開く';
    });
    document.getElementById('save-task-button').addEventListener('click', async () => {
      const label = document.getElementById('task-label').value.trim();
      const text = document.getElementById('task-text').value.trim();
      const points = safePoints(document.getElementById('task-points').value);
      if (!label || !text) { alert('ボタン名と依頼文を入力してください。'); return; }
      if (!currentUser) { alert('先にGoogleログインしてください。'); return; }
      await updateSharedState(state => {
        if (editingTaskId) {
          state.quickTasks = state.quickTasks.map(task => task.id === editingTaskId ? { ...task, label, text, points } : task);
        } else {
          state.quickTasks.push({ id: `task-${Date.now()}-${Math.random().toString(36).slice(2,6)}`, label, text, points });
        }
        return state;
      });
      resetTaskForm();
    });
    document.getElementById('cancel-task-edit').addEventListener('click', resetTaskForm);

    loginButton.addEventListener('click', async () => {
      loginButton.disabled = true;
      try {
        setStatus('Googleログインを開始しています…');
        const provider = new GoogleAuthProvider();
        await signInWithPopup(auth, provider);
        setStatus('Googleログインに成功しました。共有データに接続しています…');
      } catch (error) {
        console.error('Googleログイン（ポップアップ）', error);
        if (['auth/popup-blocked', 'auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(error?.code)) {
          try {
            setStatus('ポップアップが使えないため、Googleログイン画面へ移動します…');
            await signInWithRedirect(auth, new GoogleAuthProvider());
            return;
          } catch (redirectError) { showError(redirectError, 'Googleログイン（リダイレクト）に失敗しました'); }
        } else { showError(error, 'Googleログインに失敗しました'); }
      } finally { loginButton.disabled = false; }
    });
    logoutButton.addEventListener('click', async () => {
      try { await signOut(auth); } catch (error) { showError(error, 'ログアウトに失敗しました'); }
    });
    getRedirectResult(auth).then(result => {
      if (result?.user) setStatus(`Googleログイン成功：${result.user.email || 'アカウントを確認しました'}。共有データに接続しています…`);
    }).catch(error => showError(error, 'Googleログイン結果の受け取りに失敗しました'));

    // Midnight refreshes the visible daily count even if the page remains open.
    function scheduleMidnightRefresh() {
      const now = new Date();
      const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 1);
      setTimeout(() => {
        render();
        if (currentUser) ensureTodayCount();
        scheduleMidnightRefresh();
      }, Math.max(1000, next.getTime() - now.getTime()));
    }
    scheduleMidnightRefresh();

    setStatus('Firebaseに接続中です。ログイン状態を確認しています…');
    onAuthStateChanged(auth, user => {
      currentUser = user;
      if (user) {
        loginButton.classList.add('hidden');
        logoutButton.classList.remove('hidden');
        accountEl.textContent = `ログイン中：${user.email || 'Googleアカウント'}`;
        setStatus('ログインしました。共有データに接続しています…');
        addButton.disabled = false;
        listenToSharedState();
      } else {
        if (unsubscribeState) { unsubscribeState(); unsubscribeState = null; }
        orders = []; history = []; completedCount = 0; completedDate = ''; pointsTotal = 0; quickTasks = defaultTasks.map(task => ({...task}));
        render();
        loginButton.classList.remove('hidden');
        logoutButton.classList.add('hidden');
        accountEl.textContent = '';
        addButton.disabled = true;
        setStatus('ログインすると、夫婦で注文を共有できます。');
        listEl.innerHTML = '<div class="text-center text-stone-500 text-xs py-8">Googleログインすると注文を読み込みます。</div>';
      }
    });
  </script>
</body>
</html>
